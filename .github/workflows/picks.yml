name: Generate Catalyst Picks

on:
  schedule:
    # 12:07 UTC daily. Crypto trades 24/7, so unlike the equities version there
    # is no closing bell to wait for and no weekend gap — every day is a board.
    #
    # GitHub does not run these on time. Measured on the sibling edgeai-picks
    # repo over Aug 29 - Sep 4 2026, cron-to-commit delay ran 2h24m to 4h47m, so
    # the board realistically lands 14:30-17:00 UTC. That is fine here: grading
    # is spot-to-spot against the stored entry price, so a late run changes the
    # holding period slightly but never breaks the comparison.
    #
    # NEVER quote the cron time in UI copy — it is not when picks appear.
    #
    # :07 rather than :00 — GitHub deprioritises schedules on the hour.
    - cron: '7 12 * * *'
  workflow_dispatch:

jobs:
  picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and grade
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional. CoinGecko's keyless tier works but throttles hard; a free
          # Demo key raises the ceiling to 10k calls/month. Nothing here needs a
          # paid plan — one markets call per run covers the whole universe.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node generate-picks.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add picks.json picks-archive.json
          git diff --staged --quiet || (git commit -m "chore: picks $(date -u +%Y-%m-%d) [skip ci]" && git push)
